# Local infrastructure for the Tasks API.
#   docker compose up -d        -> SQL Server 2022 on localhost:1433
#   docker compose down -v      -> stop and wipe the data volume
# The password must satisfy the SQL Server policy (8+ chars, upper, lower, digit, symbol)
# and match ConnectionStrings:DefaultConnection in src/Tasks.Api/appsettings*.json.
name: tasks

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tasks-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Your_strong_Passw0rd}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  sqlserver-data:
